name: Testes do backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    paths:
      - backend/**
      - .github/workflows/backend.yml

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mf_test
      TEST_DATABASE_USERNAME: mf
      TEST_DATABASE_PASSWORD: mf

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O runner ja vem com PostgreSQL instalado (parado); sem Docker nem services.
      - name: Iniciar PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER mf WITH PASSWORD 'mf';"
          sudo -u postgres createdb -O mf mf_test

      - name: Rodar testes
        run: ./mvnw -B test
