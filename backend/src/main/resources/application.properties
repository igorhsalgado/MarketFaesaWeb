spring.application.name=MarketFaesa
server.error.include-stacktrace=never
server.error.include-message=never

# Banco de dados (PostgreSQL no Neon). Os valores vem de variaveis de ambiente
# ou do perfil local (application-local.properties, ver o .example em backend/).
# Os padroes vazios (":}") existem para os testes, que trocam o DataSource por
# PostgresDeTeste; sem as variaveis, a aplicacao nao sobe (sem URL de banco).
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Flyway usa a conexao direta (sem pooler) quando DATABASE_DIRECT_URL existir
spring.flyway.url=${DATABASE_DIRECT_URL:${DATABASE_URL:}}
spring.flyway.user=${DATABASE_USERNAME:}
spring.flyway.password=${DATABASE_PASSWORD:}

# O schema e criado so pelas migrations do Flyway; o Hibernate apenas confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET precisa ter pelo menos 32 bytes; sem ele a aplicacao
# nao sobe. Gere um com: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao=${JWT_EXPIRACAO:24h}

# Origens liberadas no CORS, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://arthurnunesdev.github.io,http://localhost:5173}
