# Blueprint do Render: API (Docker) + front (site estatico).
# Referencia: https://render.com/docs/blueprint-spec
#
# O banco fica no Neon (fora do Render); as variaveis DATABASE_* sao pedidas
# na criacao do Blueprint (sync: false). Passo a passo no README.md.
#
# URLs: o Render usa o nome do servico como subdominio. Se o nome estiver
# ocupado, ele gera outro (ex.: marketfaesa-api-xxxx.onrender.com) e e preciso
# ajustar as tres URLs abaixo: CORS_ALLOWED_ORIGINS (API), VITE_API_URL e o
# destino do rewrite /api/* (front).
#
# Os caminhos sao relativos a raiz do repositorio (sem rootDir), e o
# buildFilter evita que mudanca so no front reconstrua a API e vice-versa.

services:
  - type: web
    name: marketfaesa-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Strings JDBC do Neon: com -pooler na URL da aplicacao e sem -pooler na
      # do Flyway. Preenchidas no painel na criacao do Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Valor aleatorio de 256 bits em base64 (44 caracteres); o JwtConfig
      # exige pelo menos 32 bytes.
      - key: JWT_SECRET
        generateValue: true
      # Cabe nos 512 MB do plano free
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -Xss512k -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1
      - key: CORS_ALLOWED_ORIGINS
        value: https://marketfaesa-web.onrender.com

  - type: web
    name: marketfaesa-web
    runtime: static
    # base "/" no lugar do caminho do GitHub Pages definido no vite.config.js
    buildCommand: cd MarketPlace && npm ci && npm run build -- --base=/
    staticPublishPath: ./MarketPlace/dist
    buildFilter:
      paths:
        - MarketPlace/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # O front chama a API pela propria origem; o rewrite abaixo repassa
      # /api/* para o servico da API.
      - key: VITE_API_URL
        value: https://marketfaesa-web.onrender.com
    routes:
      # A ordem importa: vale a primeira regra que casar
      - type: rewrite
        source: /api/*
        destination: https://marketfaesa-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
